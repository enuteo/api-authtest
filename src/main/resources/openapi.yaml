openapi: 3.0.3
info:
  title: Secure API
  version: 1.0.0
  description: |
    Documentation for secure-api. GET /object/{id} requires the objectrole role.
servers:
  - url: /
paths:
  /object/{id}:
    get:
      summary: Get an object by ID
      description: |
        Retrieves an object using its numeric ID. Requires a valid Keycloak
        bearer token with the objectrole role.
      operationId: getObjectById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID supplied to the endpoint.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Object returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyObject'
              example:
                id: 1
                name: First object
        '400':
          description: The path ID is not a valid 64-bit integer.
        '401':
          description: A valid bearer token is required.
        '403':
          description: The token does not have the objectrole role.
        '404':
          description: No object exists with the requested ID.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MyObject:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Object identifier.
          example: 1
        name:
          type: string
          description: Object name stored in base_objects.
          example: First object